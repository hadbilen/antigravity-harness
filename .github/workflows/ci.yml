name: Antigravity Harness CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Validate Python syntax and bytecode compilation
      run: |
        python -m compileall guard porter installers tests scripts

    - name: Run unit test suite
      run: |
        python -m unittest discover -s tests -v

    - name: Verify candidate code against immutable base tests (Trust Boundary Split)
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
        git checkout origin/${{ github.base_ref }} -- tests
        python -m unittest discover -s tests -v

    - name: Run deterministic invariant verification
      shell: bash
      run: |
        python scripts/verify_invariants.py --all

  build-binaries:
    name: Build Standalone Binary on ${{ matrix.os }}
    needs: [test-matrix]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: agy-guard-linux-x86_64
          - os: macos-latest
            artifact-name: agy-guard-macos-x86_64
          - os: windows-latest
            artifact-name: agy-guard-windows-x86_64.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pystray pillow

    - name: Build Standalone Executable
      shell: bash
      run: |
        python installers/build_binaries.py

    - name: Upload Standalone Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: dist/*

    - name: Attach Binary to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        gh release upload ${{ github.ref_name }} dist/* --clobber || gh release create ${{ github.ref_name }} dist/* --title "Antigravity Harness ${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}: Pre-Session Boot Sentinel & Security Hardening"

