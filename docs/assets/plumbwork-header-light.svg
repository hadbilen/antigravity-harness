<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 156" width="596" height="156" role="img" aria-label="Plumbwork">
  <title>Plumbwork</title>
  <desc>Plumbwork architectural emblem and wordmark: Constitution, Auditors, Porter, and Plumb Guard.</desc>

  <!-- Plumbwork Emblem (Shield Boundary + True-Vertical Plumb Bob) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer governance shield -->
    <path d="M102 16 L152 36 V88 C152 114 130 132 102 140 C74 132 52 114 52 88 V36 Z" stroke="#2563EB" stroke-width="4.5"/>

    <!-- Top horizontal level bar -->
    <line x1="74" y1="46" x2="130" y2="46" stroke="#2563EB" stroke-width="3.5"/>
    <line x1="74" y1="41" x2="74" y2="51" stroke="#2563EB" stroke-width="3"/>
    <line x1="130" y1="41" x2="130" y2="51" stroke="#2563EB" stroke-width="3"/>

    <!-- Calibration drift ticks -->
    <g stroke="#94A3B8" stroke-width="2">
      <line x1="63" y1="68" x2="70" y2="68"/>
      <line x1="63" y1="80" x2="72" y2="80"/>
      <line x1="63" y1="92" x2="70" y2="92"/>
      <line x1="134" y1="68" x2="141" y2="68"/>
      <line x1="132" y1="80" x2="141" y2="80"/>
      <line x1="134" y1="92" x2="141" y2="92"/>
    </g>

    <!-- Plumb suspension line & lower alignment reticle -->
    <line x1="102" y1="49" x2="102" y2="63" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="102" y1="116" x2="102" y2="124" stroke="#0F172A" stroke-width="2"/>
  </g>

  <!-- Anchor pivot + two-facet machined plumb bob -->
  <circle cx="102" cy="46" r="3.5" fill="#B45309"/>
  <polygon points="94,63 110,63 115,71 89,71" fill="#2563EB"/>
  <polygon points="87,74 102,74 102,113" fill="#B45309"/>
  <polygon points="102,74 117,74 102,113" fill="#92400E"/>
  <circle cx="102" cy="127" r="2.75" fill="#2563EB"/>

  <!-- Vertical datum divider -->
  <line x1="180" y1="34" x2="180" y2="122" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Wordmark & Pillar Descriptor -->
  <text x="206" y="80" fill="#0F172A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.4">Plumbwork</text>

  <!-- Two-segment structural horizon rule -->
  <line x1="206" y1="96" x2="262" y2="96" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="96" x2="540" y2="96" stroke="#CBD5E1" stroke-width="1.25"/>

  <text x="206" y="122" fill="#475569" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">Constitution · Auditors · Porter · Plumb Guard</text>
</svg>
